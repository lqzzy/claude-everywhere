<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#ece4dd,#e6dcd3);font-family:-apple-system,"PingFang SC",sans-serif;padding:30px}
.row{display:flex;gap:26px;align-items:flex-start;justify-content:center}
.col{width:320px;flex:0 0 320px}
.cap{color:#3a312a;font-size:17px;font-weight:700;margin-bottom:3px}
.sub{color:#8a7d70;font-size:12.5px;margin-bottom:12px;line-height:1.4;height:34px}
.col img{width:320px;border-radius:18px;border:1px solid rgba(255,255,255,.6);display:block;box-shadow:0 16px 44px rgba(150,110,85,.28)}
.n{display:inline-block;background:#c96442;color:#fff;border-radius:7px;font-size:13px;padding:1px 9px;margin-right:7px}
</style></head><body>
<div class="row">
  <div class="col"><div class="cap"><span class="n">6</span>液态暖白</div><div class="sub">白为主 · 珊瑚渐变 · 均衡稳重</div><img src="d6.png"></div>
  <div class="col"><div class="cap"><span class="n">7</span>蜜桃磨砂</div><div class="sub">更暖更通透 · 玻璃气泡 · 慵懒治愈</div><img src="d7.png"></div>
  <div class="col"><div class="cap"><span class="n">8</span>通透液态</div><div class="sub">最亮最薄 · 悬浮药丸 · 最像 iOS 26</div><img src="d8.png"></div>
</div>
</body></html>
