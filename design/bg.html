<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:393px;height:852px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,#fffaf6 0%,#fef4ee 55%,#fffbf8 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px)}
.b1{width:240px;height:240px;background:#f4ab8a;top:-30px;right:-40px;opacity:.32}
.b2{width:220px;height:220px;background:#f5cf94;bottom:120px;left:-70px;opacity:.28}
.b3{width:240px;height:240px;background:#eda0aa;bottom:-30px;right:-50px;opacity:.24}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</body></html>
